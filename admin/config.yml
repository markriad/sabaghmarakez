backend:
  name: github
  repo: markriad/sabaghmarakez
  branch: main
  base_url: https://sveltia-cms-auth.markriad.workers.dev
  commit_messages:
    update: Update {{collection}}
    uploadMedia: Upload {{path}}
    deleteMedia: Delete {{path}}
media_folder: assets/img/uploads
public_folder: assets/img/uploads
publish_mode: simple
media_libraries:
  all:
    max_file_size: 12000000
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 82
        width: 2400
        height: 2400
      svg:
        optimize: true
collections:
- name: settings
  label: Phone number and tracking
  files:
  - name: contact
    label: Phone and WhatsApp
    file: content/settings.json
    description: Used by every call and WhatsApp button across all four pages.
    fields:
    - name: phone
      label: Phone number
      widget: string
      required: false
      hint: Include the country code, e.g. +201220170162
    - name: whatsapp
      label: WhatsApp number
      widget: string
      required: false
      hint: Digits only — no plus sign, no spaces
    - name: formEndpoint
      label: Lead form address
      widget: string
      required: false
      hint: The Google Script link. Leave alone unless it stops working.
    - name: gtmId
      label: Google Tag Manager ID
      widget: string
      required: false
      hint: Google Tag Manager container, e.g. GTM-XXXXXXX. Optional. If you use GTM to fire GA4, Ads
        or Meta, leave those three boxes below EMPTY or every number will be counted twice.
    - name: ga4Id
      label: Google Analytics 4 ID
      widget: string
      required: false
      hint: GA4 measurement ID, e.g. G-XXXXXXXXXX. Leave empty if GA4 is fired through GTM.
    - name: adsId
      label: Google Ads conversion ID
      widget: string
      required: false
      hint: Google Ads conversion ID, e.g. AW-123456789. Needed for conversion tracking.
    - name: adsConversionLabel
      label: Google Ads conversion label
      widget: string
      required: false
      hint: The conversion label from Google Ads. Both this and the Ads ID must be filled in before conversions
        are recorded.
    - name: metaPixelId
      label: Meta Pixel / Dataset ID
      widget: string
      required: false
      hint: Meta pixel ID, digits only. Setting this installs the pixel and fires a Lead on the thank-you
        page. Leave empty if the pixel is fired through GTM.
    - name: newLaunch
      label: New launch markers
      widget: list
      required: false
      collapsed: false
      summary: '{{fields.project}} — until {{fields.until}}'
      hint: Marks a project as newly launched. The tag shows on its homepage card, in the Developments
        menu and on its own page. Leave the list empty for none. Each entry disappears from the site by
        itself the day after its end date, so there is nothing to remember to remove.
      fields:
      - name: project
        label: Which project
        widget: select
        required: true
        options:
        - Ramla
        - Crescent Walk
        - District 5
        - Shams Soma
        hint: Must match the project name exactly — this is how the tag finds its card.
      - name: label
        label: Tag on the card
        widget: string
        required: false
        default: New launch
      - name: short
        label: Tag in the menu
        widget: string
        required: false
        default: New
        hint: Kept short — the menu row is narrow.
      - name: heroLabel
        label: Badge on the project page
        widget: string
        required: false
        default: Now launching
      - name: until
        label: Show until
        widget: datetime
        required: true
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        hint: Required. After this date the tag is removed from the site automatically.
- name: home
  label: 2. Homepage
  files:
  - name: home
    label: Homepage
    file: content/home.json
    fields:
    - name: cards
      label: 1 · Project card photos
      widget: list
      collapsed: false
      summary: '{{fields.label}}'
      hint: One row per card on the homepage. Each is matched to its project by the hidden key, so reordering
        the cards on the page can never swap the photos.
      fields:
      - name: key
        label: Project (do not change)
        widget: select
        options:
        - ramla
        - shams
        - district5
        - crescent
        - aeon
        required: true
        hint: This is how the photo finds its card.
      - name: label
        label: Name
        widget: string
        required: false
      - name: image
        label: Photo
        widget: image
        required: false
        hint: 1200 x 675.
    - name: images
      label: 4 · Main photos
      widget: object
      collapsed: false
      hint: Every slot below is a fixed shape. Whatever you upload is fitted into it, so the page layout
        never changes. Match the size given for each slot and nothing gets cropped unexpectedly. Leave
        a slot empty to keep the current photo.
      fields:
      - name: hero
        label: Main image at the top
        widget: image
        required: false
        hint: 1920 x 1080 px (16:9) — centre-cropped to fill
      - name: about2
        label: Photo in the About Marakez section
        widget: image
        required: false
        hint: 1200 x 900 px (4:3) — centre-cropped to fill. A photograph of Mall of Arabia suits this
          best; a Marakez development shot is standing in for now.
    - name: heroFacts
      label: 5 · The three figures under the headline
      widget: list
      required: false
      collapsed: true
      summary: '{{fields.value}} - {{fields.label}}'
      hint: Up to four sit on one line before they wrap. Leave the list empty and the strip disappears.
      fields:
      - name: value
        label: The figure
        widget: string
        required: false
        hint: 'For example: 400 acres. Type an ampersand as & , not &amp; — the site prints whatever you
          type here exactly.'''
      - name: label
        label: What it means
        widget: string
        required: false
        hint: 'For example: on Ras El Hekma bay'
    - name: en
      label: 6 · Wording (English)
      widget: object
      collapsed: true
      fields:
      - name: hero_kicker
        label: Small label above the headline
        widget: string
        required: false
      - name: hero_title
        label: Headline
        widget: string
        required: false
        hint: The full headline including the italic part.
      - name: hero_title_em
        label: Which words are italic?
        widget: string
        required: false
        hint: Copy the exact words from the headline that should be italic and coloured.
      - name: facts
        label: The four facts below the image
        widget: list
        required: false
        summary: '{{fields.label}} — {{fields.value}}'
        fields:
        - name: label
          label: Small label
          widget: string
          required: false
        - name: value
          label: Big number or word
          widget: string
          required: false
        - name: sub
          label: Small line underneath
          widget: string
          required: false
      - name: sections
        label: Section headings
        widget: list
        required: false
        summary: '{{fields.eyebrow}} — {{fields.title}}'
        hint: One row per section, in the order they appear down the page.
        fields:
        - name: eyebrow
          label: Small label above the heading
          widget: string
          required: false
        - name: title
          label: Heading
          widget: string
          required: false
        - name: title_em
          label: Which words are italic?
          widget: string
          required: false
        - name: lead
          label: Paragraph under the heading
          widget: text
          required: false
      - name: pillars
        label: The three points under the description
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
        - name: title
          label: Title
          widget: string
          required: false
        - name: text
          label: Text
          widget: text
          required: false
      - name: masterplanKey
        label: Masterplan key
        widget: list
        required: false
        summary: '{{fields.num}}. {{fields.title}}'
        fields:
