          - name: heroImage
            label: 'Main image at the top of the page'
            widget: image
            required: false
          - name: gallery
            label: 'Gallery images'
            label_singular: 'image'
            widget: list
            required: false
            fields:
              - { name: image, label: 'Image', widget: image }

      - name: district5
        label: District 5 — New Katameya
        file: content/district5.json
        fields:
