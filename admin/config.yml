- name: ramla
  label: 3. Ramla
  files:
  - name: ramla
    label: Ramla — North Coast
    file: content/ramla.json
    fields:
    - name: money
      label: 1 · Prices and offers
      widget: object
      collapsed: false
      hint: The band under the hero. Leave the price empty and the whole band is hidden.
      fields:
      - name: priceFrom
        label: Homes from
        widget: string
        required: false
        hint: 'For example: EGP 12.5M'
      - name: priceNote
        label: Small print under the button
        widget: string
        required: false
      - name: ctaLabel
        label: Button label
        widget: string
        required: false
      - name: plans
        label: Payment plans
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.name}} - {{fields.down}}% over {{fields.years}} years'
        hint: Add one row per plan you offer. The headline figures above ("from 10% down", "up to 8 years")
          are worked out from these, so you never type them twice. For a cash plan put 100 in down and
          0 in years.
        fields:
        - name: name
          label: Plan name
          widget: string
          required: false
        - name: down
          label: Down payment %
          widget: number
          value_type: int
          min: 0
          max: 100
          required: false
        - name: years
          label: Instalment years
          widget: number
          value_type: int
          min: 0
          max: 30
          required: false
        - name: note
          label: Note
          widget: string
          required: false
          hint: Only used for cash plans, e.g. 15% discount
      - name: offers
        label: Current offers
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.flag}} - until {{fields.until}}'
        hint: Leave empty and no offer shows. Each offer disappears from the site by itself the day after
          its end date, so there is nothing to remember to take down. More than three at once and the
          block gets taller than the band above it.
        fields:
        - name: flag
          label: Short flag
          widget: string
          required: false
          hint: 'For example: This month, Launch, Referral'
        - name: text
          label: What the offer is
          widget: text
          required: false
        - name: cond
          label: Conditions
          widget: string
          required: false
        - name: until
          label: Runs until
          widget: datetime
          date_format: YYYY-MM-DD
          time_format: false
          picker_utc: true
          required: true
          hint: Required. After this date the offer is removed from the site.
    - name: propertyTypes
      label: 2 · What is for sale
      label_singular: type
      widget: list
      required: false
      summary: '{{fields.label_en}} — {{fields.status}}'
      hint: Sold-out types are greyed out and cannot be picked in the enquiry form.
      fields:
      - name: label_en
        label: Name (English)
        widget: string
        required: false
      - name: label_ar
        label: Name (Arabic)
        widget: string
        required: false
      - name: size
        label: Size
        widget: string
        required: false
        hint: 'Shown on the type''s panel. For example: 320 - 480 sqm. Leave it empty and the panel reads
          "On request" rather than showing a blank.'
      - name: photos
        label: Photos of this type
        widget: list
        required: false
        collapsed: true
        summary: '{{fields.image}}'
        hint: One or more. They become a swipeable strip on the type's panel; with a single photo there
          are no arrows or dots. 1600 x 1000 px (16:10), centre-cropped to fill.
        fields:
        - name: image
          label: Photo
          widget: image
          required: false
      - name: status
        label: Availability
        widget: select
        default: available
        options:
        - label: Available
          value: available
        - label: Few left
          value: limited
        - label: Sold out
          value: sold_out
      - name: options
        label: Bedroom options
        widget: string
        required: false
        hint: 'Separate with a bar: 3|4|5. Commas or one per line work too. Leave empty and no follow-up
          question is asked for this type.'
      - name: optionKind
        label: What the options are
        widget: hidden
        default: beds
      collapsed: false
    - name: images
      label: 4 · Main photos
