        required: false
        summary: '{{fields.title}}'
        hint: The content shown when someone clicks each tab.
        fields:
        - name: sub
          label: Small label
          widget: string
          required: false
        - name: title
          label: Tab heading
          widget: string
          required: false
        - name: text
          label: Description
