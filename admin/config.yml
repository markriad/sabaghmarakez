backend:
  name: github
  repo: markriad/sabaghmarakez
  branch: main
  base_url: https://sveltia-cms-auth.markriad.workers.dev
  commit_messages:
    update: Update {{collection}}
    uploadMedia: Upload {{path}}
    deleteMedia: Delete {{path}}
media_folder: assets/img/uploads
public_folder: assets/img/uploads
publish_mode: simple
# Every uploaded photo is converted to WebP and scaled down to fit 2400x2400
# before it is saved. Combined with the fixed slot shapes in the CSS, this means
# an oversized upload can neither slow the site down nor change any layout.
media_libraries:
  all:
    max_file_size: 12000000
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 82
        width: 2400
        height: 2400
      svg:
        optimize: true
collections:
- name: settings
  label: 1. My details
  files:
  - name: contact
    label: Phone and WhatsApp
    file: content/settings.json
    description: Used by every call and WhatsApp button across all four pages.
    fields:
    - name: phone
      label: Phone number
      widget: string
      required: false
      hint: Include the country code, e.g. +201220170162
    - name: whatsapp
      label: WhatsApp number
      widget: string
      required: false
      hint: Digits only — no plus sign, no spaces
    - name: formEndpoint
      label: Lead form address
      widget: string
      required: false
      hint: The Google Script link. Leave alone unless it stops working.
    - name: gtmId
      label: Google Tag Manager ID
      widget: string
      required: false
      hint: Looks like GTM-XXXXXXX. Leave empty to switch all tracking off.
    - name: ga4Id
      label: Google Analytics 4 ID
      widget: string
      required: false
      hint: Looks like G-XXXXXXXXXX. For reference — the tag itself lives in Tag Manager.
    - name: adsId
      label: Google Ads conversion ID
      widget: string
      required: false
      hint: Looks like AW-123456789.
    - name: adsConversionLabel
      label: Google Ads conversion label
      widget: string
      required: false
      hint: The short code beside the conversion ID.
    - name: metaPixelId
      label: Meta Pixel / Dataset ID
      widget: string
      required: false
      hint: The numeric ID from Meta Events Manager.
- name: home
  label: 2. Homepage
  files:
  - name: home
    label: Homepage
    file: content/home.json
    fields:
    - name: logos
      label: Logos
      widget: object
      collapsed: true
      fields:
      - name: marakez
        label: Marakez logo (header)
        widget: image
        required: false
        hint: >-
          PNG or SVG on a transparent background, about 340 x 100 px. Shown 26 px
          tall and never wider than 170 px. Leave empty to show the word "Marakez".
      - name: project
        label: Project logo (hero)
        widget: image
        required: false
        hint: >-
          PNG or SVG on a transparent background, about 480 x 120 px. Shown 30 px
          tall and never wider than 240 px.
    - name: heroFacts
      label: Key facts under the headline
      widget: list
      required: false
      collapsed: false
      summary: '{{fields.value}} - {{fields.label}}'
      hint: >-
        Up to four sit on one line before they wrap. Leave the list empty and
        the strip disappears.
      fields:
      - name: value
        label: The figure
        widget: string
        required: false
        hint: >-
          For example: 400 acres. Type an ampersand as & , not &amp; — the site
          prints whatever you type here exactly.'
      - name: label
        label: What it means
        widget: string
        required: false
        hint: 'For example: on Ras El Hekma bay'
    - name: images
      label: Photos on this page
      widget: object
      collapsed: true
      hint: >-
        Every slot below is a fixed shape. Whatever you upload is fitted into it, so the page layout never changes. Match the size given for each slot and nothing gets cropped unexpectedly. Leave a slot empty to keep the current photo.
      fields:
      - name: hero
        label: Main image at the top
        widget: image
        required: false
        hint: '1920 x 1080 px (16:9) — centre-cropped to fill'
      - name: about2
        label: Photo in the About Marakez section
        widget: image
        required: false
        hint: '1200 x 900 px (4:3) — centre-cropped to fill. A photograph of Mall of
          Arabia suits this best; a Marakez development shot is standing in for now.'
      - name: why
        label: Your portrait, beside "Working with me"
        widget: image
        required: false
        hint: '1000 x 1250 px (4:5, upright) — centre-cropped to fill. Leave empty and
          the four points become full-height columns instead.'
    - name: heroScrim
      label: Darken the hero image
      widget: select
      default: medium
      options:
      - label: Light — for dark photos
        value: light
      - label: Medium — most photos
        value: medium
      - label: Strong — for bright photos
        value: strong
      hint: If the headline is hard to read over the image, choose Strong.
    - name: cards
      label: Project cards
      widget: list
      required: false
      summary: '{{fields.key}}'
      hint: The three cards on the homepage. Swap the photo for each project here.
      fields:
      - name: key
        label: Project
        widget: select
        options:
        - label: Ramla
          value: ramla
        - label: Crescent Walk
          value: crescent
        - label: District 5
          value: district5
      - name: image
        label: Card photo
        widget: image
        required: false
        hint: '1200 x 900 px (4:3) — centre-cropped to fill'
      - name: size
        label: Size
        widget: string
        required: false
        hint: >-
          Shown on the type's panel. For example: 320 - 480 sqm. Leave it empty
          and the panel reads "On request" rather than showing a blank.
      - name: photos
        label: Photos of this type
        widget: list
        required: false
        collapsed: true
        summary: '{{fields.image}}'
        hint: >-
          One or more. They become a swipeable strip on the type's panel; with a
          single photo there are no arrows or dots. 1600 x 1000 px (16:10),
          centre-cropped to fill.
        fields:
        - name: image
          label: Photo
          widget: image
          required: false
      - name: status
        label: Availability
        widget: select
        default: available
        options:
        - label: Available
          value: available
        - label: Few left
          value: limited
        - label: Sold out
          value: sold_out
    - name: en
      label: English text
      widget: object
      collapsed: true
      fields:
      - name: hero_kicker
        label: Small label above the headline
        widget: string
        required: false
      - name: hero_title
        label: Headline
        widget: string
        required: false
        hint: The full headline including the italic part.
      - name: hero_title_em
        label: Which words are italic?
        widget: string
        required: false
        hint: Copy the exact words from the headline that should be italic and coloured.
      - name: hero_text
        label: Paragraph under the headline
        widget: text
        required: false
      - name: facts
        label: The four facts below the image
        widget: list
        required: false
        summary: '{{fields.label}} — {{fields.value}}'
        fields:
        - name: label
          label: Small label
          widget: string
          required: false
        - name: value
          label: Big number or word
          widget: string
          required: false
        - name: sub
          label: Small line underneath
          widget: string
          required: false
      - name: sections
        label: Section headings
        widget: list
        required: false
        summary: '{{fields.eyebrow}} — {{fields.title}}'
